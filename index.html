<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DownMyPlant</title>
  <meta name="description" content="Reconnaître vos plantes et prendre soin de votre parc.">
  <meta name="theme-color" content="#fbf6ee">
  <script>
    // Thème choisi dans Réglages (clair par défaut), appliqué avant l'affichage.
    try {
      var t = (JSON.parse(localStorage.getItem('downmyplant.settings') || '{}').theme) || 'light';
      if (t === 'dark' || t === 'auto') document.documentElement.dataset.theme = t;
    } catch (e) { /* clair */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS : écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DownMyPlant">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="rooms.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back-btn" hidden aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="page-title">Mes plantes</h1>
    <span class="topbar-spacer"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button data-route="plants" class="tab active">
      <span class="tab-ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 10 11.5 5 20 4.5 19.5 13 15 19 5 19z"/><path d="M5 19l8-8"/></svg></span><span>Mes plantes</span>
    </button>
    <button data-route="identify" class="tab">
      <span class="tab-ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5h3.2l1.8-2.5h7l1.8 2.5h3.2v11h-17z"/><circle cx="12" cy="13.5" r="3.6"/></svg></span><span>Identifier</span>
    </button>
    <button data-route="rooms" class="tab">
      <span class="tab-ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5L12 4.5l8.5 7"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/></svg></span><span>Pièces</span>
    </button>
    <button data-route="settings" class="tab">
      <span class="tab-ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg></span><span>Réglages</span>
    </button>
  </nav>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
