<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DownMyPlant</title>
  <meta name="description" content="Reconnaître vos plantes et prendre soin de votre parc.">
  <meta name="theme-color" content="#2f6b3a">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS : écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DownMyPlant">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back-btn" hidden aria-label="Retour">‹</button>
    <h1 id="page-title">Mes plantes</h1>
    <span class="topbar-spacer"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button data-route="plants" class="tab active">
      <span class="tab-ico" aria-hidden="true">🪴</span><span>Mes plantes</span>
    </button>
    <button data-route="identify" class="tab">
      <span class="tab-ico" aria-hidden="true">📷</span><span>Identifier</span>
    </button>
    <button data-route="settings" class="tab">
      <span class="tab-ico" aria-hidden="true">⚙️</span><span>Réglages</span>
    </button>
  </nav>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
